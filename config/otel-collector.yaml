extensions:
  bearertokenauth: { scheme: "Bearer", token: "${env:INGEST_TOKEN}" }
  health_check: { endpoint: 0.0.0.0:13133 }
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317, auth: { authenticator: bearertokenauth } }
      http: { endpoint: 0.0.0.0:4318, auth: { authenticator: bearertokenauth } }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 1500, spike_limit_mib: 512 }
  batch: { timeout: 10s, send_batch_size: 1024, send_batch_max_size: 2048 }
exporters:
  otlp_http/victoriametrics:
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
    encoding: proto
    compression: gzip
    tls: { insecure: true }
  otlp_http/victorialogs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
    encoding: proto
    compression: gzip
    tls: { insecure: true }
service:
  extensions: [bearertokenauth, health_check]
  pipelines:
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/victoriametrics] }
    logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/victorialogs] }
