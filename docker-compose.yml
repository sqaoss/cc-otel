name: cc-otel

# Healthcheck note: the victoriametrics/victoria-metrics and
# victoriametrics/victoria-logs images are distroless (scratch-based) — no
# shell, no wget/curl. A shell-based Docker HEALTHCHECK would fail forever, and
# gating the collector on `depends_on: condition: service_healthy` would then
# deadlock startup. So we use plain `depends_on` ordering only and let the
# collector's otlphttp exporter `retry_on_failure` (enabled by default) tolerate
# VM/VL warming up. Do not add shell healthchecks to VM/VL.

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.152.1
    container_name: cc-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:?INGEST_TOKEN must be set in .env}
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${COLLECTOR_BIND:-0.0.0.0}:${OTLP_GRPC_PORT:-4317}:4317"
      - "${COLLECTOR_BIND:-0.0.0.0}:${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - victoriametrics
      - victorialogs

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.143.0
    container_name: cc-otel-victoriametrics
    restart: unless-stopped
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VM_RETENTION:-3}"
      - "-httpListenAddr=:8428"
    volumes:
      - ./data/victoriametrics:/storage
    ports:
      - "${COLLECTOR_BIND:-0.0.0.0}:8428:8428"

  victorialogs:
    image: victoriametrics/victoria-logs:v1.50.0
    container_name: cc-otel-victorialogs
    restart: unless-stopped
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VL_RETENTION:-90d}"
      - "-httpListenAddr=:9428"
    volumes:
      - ./data/victorialogs:/storage
    ports:
      - "${COLLECTOR_BIND:-0.0.0.0}:9428:9428"

  caddy:
    image: caddy:2-alpine
    container_name: cc-otel-caddy
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - collector
